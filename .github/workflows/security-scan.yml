name: Dependency Vulnerability Gate

on:
  pull_request:
    paths:
      - "package-lock.json"
      - "requirements.txt"
      - "go.sum"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "package-lock.json"
      - "requirements.txt"
      - "go.sum"
      - "Cargo.lock"
    # A push-to-main run scans the WHOLE lockfile (no --diff-only - there's
    # no PR base ref on a push event) and is what GitHub's code-scanning
    # alerts need as a baseline: PR runs only ever report findings as "new"
    # relative to the last analysis on the default branch, so without at
    # least one scan having landed on main, a PR's code-scanning check
    # reports "no new alerts" even when the SARIF it uploaded has real
    # findings in it - confirmed live in this project's own demo PR.

permissions:
  contents: read
  security-events: write # required to upload SARIF to code scanning
  pull-requests: write # required for --pr-comment (pull_request events only)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed so `git show origin/<base>:<file>` works

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        run: pip install -r requirements.txt

      # Split restore/save (rather than the combined actions/cache action)
      # so the save step can run unconditionally via `if: always()` below -
      # this gate's job legitimately fails on real findings, and a PR
      # sitting on an unfixed vulnerability across repeated pushes is
      # exactly the case that most needs a persisted cache. The combined
      # action's own `save-always` input looked like the right fix but is
      # deprecated and, confirmed live here, does not actually work
      # ("Cache not found" persisted across two real failing runs even
      # with save-always: true set) - GitHub's own docs point at this
      # restore/save split as the correct replacement.
      - name: Restore OSV hydration cache
        uses: actions/cache/restore@v4
        with:
          path: .dep-gate-cache.json
          key: dep-gate-osv-cache-${{ github.run_id }}
          restore-keys: |
            dep-gate-osv-cache-

      # One combined invocation across every lockfile present, not one
      # step per ecosystem - --file is repeatable (see TechSpec.md §2.10),
      # and this is what makes --pr-comment usable at all here: separate
      # per-ecosystem invocations would each find-and-overwrite the same
      # idempotent PR comment, so the final comment would only ever
      # reflect whichever ecosystem's step happened to run last, silently
      # dropping findings from the others (this was a known, documented
      # gap - see Tracker.md - until multi-file support existed).
      - name: Scan lockfiles (new/changed deps only)
        if: hashFiles('package-lock.json', 'requirements.txt', 'go.sum', 'Cargo.lock') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=()
          [ -f package-lock.json ] && FILES+=(--file package-lock.json)
          [ -f requirements.txt ] && FILES+=(--file requirements.txt)
          [ -f go.sum ] && FILES+=(--file go.sum)
          [ -f Cargo.lock ] && FILES+=(--file Cargo.lock)
          python -m dep_gate.cli \
            "${FILES[@]}" \
            --fail-on high \
            ${{ github.event_name == 'pull_request' && format('--diff-only --base-ref origin/{0}', github.base_ref) || '' }} \
            --json report.json \
            --sarif report.sarif \
            --cache-file .dep-gate-cache.json \
            ${{ github.event_name == 'pull_request' && format('--pr-comment --github-repo {0} --github-pr-number {1}', github.repository, github.event.pull_request.number) || '' }}

      - name: Save OSV hydration cache
        if: always() # must run even when the scan step above fails - see the restore step's comment
        uses: actions/cache/save@v4
        with:
          path: .dep-gate-cache.json
          key: dep-gate-osv-cache-${{ github.run_id }}

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-vulnerability-report
          path: report.json
          if-no-files-found: ignore

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report.sarif
          category: dep-gate
        continue-on-error: true # a scan-step failure above must not be masked by this step
