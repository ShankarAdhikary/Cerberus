name: Dependency Vulnerability Gate

on:
  pull_request:
    paths:
      - "package-lock.json"
      - "requirements.txt"
      - "go.sum"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "package-lock.json"
      - "requirements.txt"
      - "go.sum"
      - "Cargo.lock"
    # A push-to-main run scans the WHOLE lockfile (no --diff-only - there's
    # no PR base ref on a push event) and is what GitHub's code-scanning
    # alerts need as a baseline: PR runs only ever report findings as "new"
    # relative to the last analysis on the default branch, so without at
    # least one scan having landed on main, a PR's code-scanning check
    # reports "no new alerts" even when the SARIF it uploaded has real
    # findings in it - confirmed live in this project's own demo PR.

permissions:
  contents: read
  security-events: write # required to upload SARIF to code scanning

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed so `git show origin/<base>:<file>` works

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        run: pip install -r requirements.txt

      # Split restore/save (rather than the combined actions/cache action)
      # so the save step can run unconditionally via `if: always()` below -
      # this gate's job legitimately fails on real findings, and a PR
      # sitting on an unfixed vulnerability across repeated pushes is
      # exactly the case that most needs a persisted cache. The combined
      # action's own `save-always` input looked like the right fix but is
      # deprecated and, confirmed live here, does not actually work
      # ("Cache not found" persisted across two real failing runs even
      # with save-always: true set) - GitHub's own docs point at this
      # restore/save split as the correct replacement.
      - name: Restore OSV hydration cache
        uses: actions/cache/restore@v4
        with:
          path: .dep-gate-cache.json
          key: dep-gate-osv-cache-${{ github.run_id }}
          restore-keys: |
            dep-gate-osv-cache-

      - name: Scan npm lockfile (new/changed deps only)
        if: hashFiles('package-lock.json') != ''
        run: >
          python -m dep_gate.cli
          --file package-lock.json
          --fail-on high
          ${{ github.event_name == 'pull_request' && format('--diff-only --base-ref origin/{0}', github.base_ref) || '' }}
          --json npm-report.json
          --sarif npm-report.sarif
          --cache-file .dep-gate-cache.json

      - name: Scan Python requirements (new/changed deps only)
        if: hashFiles('requirements.txt') != ''
        run: >
          python -m dep_gate.cli
          --file requirements.txt
          --fail-on high
          ${{ github.event_name == 'pull_request' && format('--diff-only --base-ref origin/{0}', github.base_ref) || '' }}
          --json python-report.json
          --sarif python-report.sarif
          --cache-file .dep-gate-cache.json

      - name: Scan Go go.sum (new/changed deps only)
        if: hashFiles('go.sum') != ''
        run: >
          python -m dep_gate.cli
          --file go.sum
          --fail-on high
          ${{ github.event_name == 'pull_request' && format('--diff-only --base-ref origin/{0}', github.base_ref) || '' }}
          --json go-report.json
          --sarif go-report.sarif
          --cache-file .dep-gate-cache.json

      - name: Scan Rust Cargo.lock (new/changed deps only)
        if: hashFiles('Cargo.lock') != ''
        run: >
          python -m dep_gate.cli
          --file Cargo.lock
          --fail-on high
          ${{ github.event_name == 'pull_request' && format('--diff-only --base-ref origin/{0}', github.base_ref) || '' }}
          --json cargo-report.json
          --sarif cargo-report.sarif
          --cache-file .dep-gate-cache.json

      - name: Save OSV hydration cache
        if: always() # must run even when a scan step above fails - see the restore step's comment
        uses: actions/cache/save@v4
        with:
          path: .dep-gate-cache.json
          key: dep-gate-osv-cache-${{ github.run_id }}

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-vulnerability-report
          path: "*-report.json"
          if-no-files-found: ignore

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .
          category: dep-gate
        continue-on-error: true # a scan-step failure above must not be masked by this step
